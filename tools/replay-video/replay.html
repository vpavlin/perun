<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Perun · Replay video</title>
<!--
  Perun Replay → video — proof of concept.

  COMPLETELY OFFLINE + self-contained: no network, no CDN, no map tiles, no web fonts.
  The route is drawn on a plain background (Perun's "hide map" look). The animation is
  rendered deterministically from the run data onto a <canvas>; "Record" captures the
  canvas with MediaRecorder and hands back a downloadable WebM. Open it with a file://
  URL — it needs nothing from the internet.

  For the real app this same renderer is fed a run's exported GPX + its annotations
  (+ media embedded as data URIs); here a sample run is synthesised so it runs standalone.
-->
<style>
  :root{
    --bg:#0d1013; --card:#161b20; --elevated:#1d242b; --border:#2a333c;
    --text:#e8edf2; --text2:#a9b4bf; --text3:#6f7c88;
    --primary:#e0932f; --success:#4caf6e; --error:#e0574a; --photo:#4aa3ff; --voice:#c07af0;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px 48px;gap:18px}
  h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.2px}
  .sub{color:var(--text3);font-size:12px;margin-top:-12px}
  .stage{position:relative;width:min(92vw,540px);aspect-ratio:1/1;border-radius:14px;overflow:hidden;
         border:1px solid var(--border);background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  canvas{width:100%;height:100%;display:block}
  .controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--text);background:var(--card);
         border:1px solid var(--border);border-radius:11px;padding:11px 16px;cursor:pointer;transition:.12s}
  button:hover{border-color:var(--primary)}
  button:disabled{opacity:.45;cursor:default;border-color:var(--border)}
  button.primary{background:var(--primary);border-color:var(--primary);color:#1a1206}
  .row{display:flex;gap:14px;align-items:center;color:var(--text2);font-size:13px;flex-wrap:wrap;justify-content:center}
  .row label{display:flex;gap:7px;align-items:center}
  input[type=range]{accent-color:var(--primary)}
  select,input[type=number]{background:var(--elevated);color:var(--text);border:1px solid var(--border);
         border-radius:8px;padding:6px 8px;font-family:var(--sans);font-size:13px}
  #status{color:var(--text3);font-size:12px;min-height:16px;font-family:var(--mono)}
  a.dl{color:var(--primary);font-weight:600;text-decoration:none;font-size:13px}
  a.dl:hover{text-decoration:underline}
</style>
</head>
<body>
  <h1>Perun · Replay → video</h1>
  <div class="sub">offline proof of concept — draws the run, records a WebM you can share</div>

  <div class="stage"><canvas id="c" width="1080" height="1080"></canvas></div>

  <div class="controls">
    <button id="preview">▶ Preview</button>
    <button id="record" class="primary">⏺ Record video</button>
    <span id="dl"></span>
  </div>
  <div class="row">
    <label>Duration
      <input id="dur" type="number" min="4" max="60" step="1" value="14" style="width:64px" /> s
    </label>
    <label>Trail
      <select id="trail"><option value="full">full route</option><option value="draw" selected>draw as it goes</option></select>
    </label>
  </div>
  <div id="status">ready · everything runs locally</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// 1) Sample run (stands in for a real exported GPX + its annotations).
//    points: {lat, lon, alt, t}   annotations: {t, kind, text, img?}
// ---------------------------------------------------------------------------
function sampleRun(){
  const originLat=50.0875, originLon=14.4213; // Prague-ish
  const pts=[]; const N=380; const startT=Date.parse("2026-08-24T07:12:00");
  // A looping ramble with a couple of hills; small jitter so it reads as GPS, not a spirograph.
  for(let i=0;i<N;i++){
    const u=i/(N-1);
    const ang=u*Math.PI*2*1.15;
    const r=0.010+0.0035*Math.sin(u*Math.PI*3.0); // varying radius → not a perfect circle
    const lat=originLat + r*Math.sin(ang)*0.72 + 0.0006*Math.sin(u*40);
    const lon=originLon + r*Math.cos(ang) + 0.0009*Math.cos(u*33);
    const alt=210 + 42*Math.sin(u*Math.PI*2.3) + 10*Math.sin(u*Math.PI*9) ; // two hills
    const t=startT + Math.round(u*30*60*1000); // 30 min run
    pts.push({lat,lon,alt,t});
  }
  const at=(frac)=>pts[Math.round(frac*(N-1))].t;
  const anns=[
    {t:at(0.18),kind:"text",text:"Legs finally woke up here 🙂"},
    {t:at(0.52),kind:"photo",text:"View over the valley",img:swatch("#2b3a2f","#7fd28a","VIEW")},
    {t:at(0.83),kind:"voice",text:"Voice note · 12s"},
  ];
  return {name:"Morning run · 24 Aug", points:pts, annotations:anns};
}
// A tiny self-contained "photo": a coloured SVG as a data URI (keeps the file offline).
function swatch(bg,fg,label){
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'>
    <rect width='400' height='300' fill='${bg}'/>
    <circle cx='300' cy='90' r='46' fill='${fg}' opacity='.85'/>
    <path d='M0 250 L120 150 L210 220 L310 130 L400 210 L400 300 L0 300 Z' fill='${fg}' opacity='.55'/>
    <text x='20' y='285' font-family='sans-serif' font-size='22' fill='#fff' opacity='.8'>${label}</text>
  </svg>`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(svg);
}

// ---------------------------------------------------------------------------
// 2) Geometry — same model as the app (mercator projection + distance axis).
// ---------------------------------------------------------------------------
const R2=Math.PI/180;
function haversine(a,b){const R=6371000,dLat=(b.lat-a.lat)*R2,dLon=(b.lon-a.lon)*R2;
  const s=Math.sin(dLat/2)**2+Math.cos(a.lat*R2)*Math.cos(b.lat*R2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));}
const mercX=lon=>(lon+180)/360;
const mercY=lat=>{const c=Math.min(85.05,Math.max(-85.05,lat)),r=c*R2;
  return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2;};

function buildModel(run,W,H,pad){
  const p=run.points;
  const cum=[0]; for(let i=1;i<p.length;i++) cum[i]=cum[i-1]+haversine(p[i-1],p[i]);
  const total=cum[cum.length-1];
  // fit bbox
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  const mx=p.map(q=>mercX(q.lon)), my=p.map(q=>mercY(q.lat));
  for(const x of mx){minx=Math.min(minx,x);maxx=Math.max(maxx,x);}
  for(const y of my){miny=Math.min(miny,y);maxy=Math.max(maxy,y);}
  const spanx=Math.max(1e-9,maxx-minx), spany=Math.max(1e-9,maxy-miny);
  const s=Math.min((W-2*pad)/spanx,(H-2*pad)/spany);
  const offx=(W-spanx*s)/2 - minx*s, offy=(H-spany*s)/2 - miny*s;
  const project=q=>[mercX(q.lon)*s+offx, mercY(q.lat)*s+offy];
  // annotations → distance along the route (nearest point by time)
  const annD=run.annotations.map(a=>{
    let bi=0,bd=1e18; for(let i=0;i<p.length;i++){const g=Math.abs(p[i].t-a.t); if(g<bd){bd=g;bi=i;}}
    return {...a, dist:cum[bi]};
  });
  // elevation series
  const elev=p.map((q,i)=>({d:cum[i],a:q.alt}));
  const minA=Math.min(...elev.map(e=>e.a)), maxA=Math.max(...elev.map(e=>e.a));
  return {p,cum,total,project,annD,elev,minA,maxA};
}
function pointAtDistance(m,d){
  const {p,cum,total}=m; d=Math.max(0,Math.min(total,d));
  let i=0; while(i<cum.length-1 && cum[i+1]<d) i++;
  const a=p[i], b=p[Math.min(i+1,p.length-1)];
  const seg=cum[Math.min(i+1,cum.length-1)]-cum[i], f=seg>0?(d-cum[i])/seg:0;
  const L=(x,y)=>x+(y-x)*f;
  return {lat:L(a.lat,b.lat),lon:L(a.lon,b.lon),alt:L(a.alt,b.alt),t:L(a.t,b.t)};
}

// ---------------------------------------------------------------------------
// 3) Render one frame at playhead distance d (progress 0..1 of the route).
// ---------------------------------------------------------------------------
const RUN=sampleRun();
const cv=document.getElementById("c"), ctx=cv.getContext("2d");
const W=cv.width, H=cv.height;
const M=buildModel(RUN,W,H,120);
const IMG={}; // preload annotation images
RUN.annotations.forEach(a=>{ if(a.img){const im=new Image(); im.src=a.img; IMG[a.text]=im;} });

const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function fmtDist(mm){return (mm/1000).toFixed(2)+" km";}
function fmtDur(s){s=Math.max(0,Math.floor(s));const h=(s/3600)|0,m=((s%3600)/60)|0,x=s%60;
  const p=n=>String(n).padStart(2,"0"); return h>0?`${h}:${p(m)}:${p(x)}`:`${m}:${p(x)}`;}
const KIND={text:"💬",photo:"📷",voice:"🎙️"};
const KCOL={text:"--primary",photo:"--photo",voice:"--voice"};

function drawFrame(d, trail){
  const c=ctx;
  c.fillStyle=css("--bg"); c.fillRect(0,0,W,H);

  // route: faint full line, bright up to the playhead (or full)
  const seg=[]; for(let i=0;i<M.p.length;i++) seg.push(M.project(M.p[i]));
  // faint whole route
  c.lineWidth=6; c.lineJoin="round"; c.lineCap="round";
  c.strokeStyle="rgba(224,147,47,0.18)";
  c.beginPath(); seg.forEach((pt,i)=> i?c.lineTo(pt[0],pt[1]):c.moveTo(pt[0],pt[1])); c.stroke();
  // travelled portion
  const upto = trail==="draw" ? d : M.total;
  c.strokeStyle=css("--primary"); c.lineWidth=7; c.beginPath();
  let started=false;
  for(let i=0;i<M.p.length;i++){
    if(M.cum[i]>upto) break;
    const pt=seg[i]; started?c.lineTo(pt[0],pt[1]):(c.moveTo(pt[0],pt[1]),started=true);
  }
  // include the exact interpolated head so the line reaches the dot
  const head=pointAtDistance(M,d), hp=M.project(head);
  if(trail==="draw"){ c.lineTo(hp[0],hp[1]); }
  c.stroke();

  // start dot + playhead
  const s0=M.project(M.p[0]);
  c.fillStyle=css("--success"); dot(s0[0],s0[1],9);
  c.fillStyle=css("--primary");
  c.globalAlpha=.25; dot(hp[0],hp[1],22); c.globalAlpha=1; dot(hp[0],hp[1],11);
  c.lineWidth=3; c.strokeStyle=css("--bg"); c.beginPath(); c.arc(hp[0],hp[1],11,0,7); c.stroke();

  // stat bar (top)
  const elapsed=(head.t-M.p[0].t)/1000;
  panel(40,40,W-80,120);
  bigStat(70,150,"DISTANCE",fmtDist(d),0);
  bigStat(W/2-60,150,"TIME",fmtDur(elapsed),1);
  bigStat(W-70,150,"ELEV",Math.round(head.alt)+" m",2);

  // elevation strip (bottom)
  elevStrip(40,H-190,W-80,150,d);

  // featured annotation card — the one we're passing
  let feat=null,bg=1e18;
  for(const a of M.annD){const g=Math.abs(a.dist-d); if(g<bg){bg=g;feat=a;}}
  const near = feat && bg<=Math.max(60,M.total*0.03);
  if(feat) annotationCard(feat, near, d);

  // watermark
  c.fillStyle=css("--text3"); c.font="600 26px "+css("--sans"); c.textAlign="left";
  c.fillText("PERUN", 44, H-210);
  c.textAlign="right"; c.fillText(RUN.name, W-44, H-210);
  c.textAlign="left";

  function dot(x,y,r){c.beginPath();c.arc(x,y,r,0,7);c.fill();}
}
function panel(x,y,w,h){const c=ctx;c.fillStyle="rgba(22,27,32,0.82)";round(x,y,w,h,16);c.fill();
  c.strokeStyle=css("--border");c.lineWidth=1.5;round(x,y,w,h,16);c.stroke();}
function round(x,y,w,h,r){const c=ctx;c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function bigStat(cx,baseY,k,v,align){const c=ctx;c.textAlign=align===0?"left":align===2?"right":"center";
  c.fillStyle=css("--text3");c.font="600 22px "+css("--sans");c.fillText(k,cx,baseY-40);
  c.fillStyle=css("--text");c.font="800 52px "+css("--sans");c.fillText(v,cx,baseY+8);c.textAlign="left";}
function elevStrip(x,y,w,h,d){
  const c=ctx; panel(x,y,w,h);
  const {elev,minA,maxA,total}=M, pad=18, spanA=Math.max(1,maxA-minA);
  const X=dd=>x+pad+(dd/total)*(w-2*pad), Y=aa=>y+h-pad-((aa-minA)/spanA)*(h-2*pad);
  c.beginPath(); c.moveTo(X(0),y+h-pad);
  elev.forEach(e=>c.lineTo(X(e.d),Y(e.a))); c.lineTo(X(total),y+h-pad); c.closePath();
  c.fillStyle="rgba(224,147,47,0.16)"; c.fill();
  c.beginPath(); elev.forEach((e,i)=> i?c.lineTo(X(e.d),Y(e.a)):c.moveTo(X(e.d),Y(e.a)));
  c.strokeStyle=css("--primary"); c.lineWidth=3; c.stroke();
  const hx=X(Math.max(0,Math.min(total,d)));
  c.strokeStyle=css("--text"); c.globalAlpha=.85; c.lineWidth=2.5;
  c.beginPath(); c.moveTo(hx,y+pad); c.lineTo(hx,y+h-pad); c.stroke(); c.globalAlpha=1;
}
function annotationCard(a, near, d){
  const c=ctx; const w=560, x=W-w-44, y=220, hasImg=a.kind==="photo"&&IMG[a.text]&&IMG[a.text].complete;
  const h=hasImg?430:150;
  // fade the card in as we approach
  const gap=Math.abs(a.dist-d), fade=Math.max(0,Math.min(1,1-(gap-0)/(Math.max(80,M.total*0.05))));
  c.globalAlpha=near?1:0.35+0.65*fade;
  panel(x,y,w,h);
  c.globalAlpha=1;
  c.font="700 30px "+css("--sans"); c.fillStyle=css(KCOL[a.kind]||"--primary");
  c.fillText(KIND[a.kind]||"•", x+22, y+46);
  c.fillStyle=css("--text2"); c.font="600 22px "+css("--sans");
  c.fillText(near?"● at this point":fmtDist(a.dist), x+64, y+44);
  if(hasImg){ const iw=w-44, ih=250; drawImgCover(IMG[a.text], x+22, y+64, iw, ih); }
  c.fillStyle=css("--text"); c.font="500 28px "+css("--sans");
  wrap(a.text||"", x+22, y+(hasImg?350:100), w-44, 34);
}
function drawImgCover(im,x,y,w,h){const c=ctx;round(x,y,w,h,10);c.save();c.clip();
  const ar=im.width/im.height, tr=w/h; let dw,dh; if(ar>tr){dh=h;dw=h*ar;}else{dw=w;dh=w/ar;}
  c.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh); c.restore();}
function wrap(text,x,y,maxw,lh){const c=ctx;const words=text.split(" ");let line="",yy=y;
  for(const w of words){const t=line?line+" "+w:w; if(c.measureText(t).width>maxw&&line){c.fillText(line,x,yy);line=w;yy+=lh;}else line=t;}
  if(line)c.fillText(line,x,yy);}

// ---------------------------------------------------------------------------
// 4) Drive the animation (and optionally record it to WebM).
// ---------------------------------------------------------------------------
const $=id=>document.getElementById(id);
let running=false;
function animate(durationS, onFrame){
  return new Promise(res=>{
    const trail=$("trail").value; const t0=performance.now();
    (function loop(now){
      const el=(now-t0)/1000, u=Math.min(1,el/durationS);
      // ease so it settles at the finish
      const d=M.total*u;
      drawFrame(d, trail);
      if(onFrame) onFrame();
      if(u>=1){ res(); return; }
      requestAnimationFrame(loop);
    })(t0);
  });
}

$("preview").onclick=async()=>{
  if(running)return; running=true; setBusy("previewing…"); $("dl").innerHTML="";
  await animate(Number($("dur").value)||14);
  drawFrame(M.total, $("trail").value);
  running=false; setBusy("ready");
};

$("record").onclick=async()=>{
  if(running)return; running=true; $("dl").innerHTML="";
  const stream=cv.captureStream(30);
  const mime=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){ setBusy("MediaRecorder/WebM not supported in this browser"); running=false; return; }
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8_000_000});
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const done=new Promise(r=>rec.onstop=r);
  setBusy("recording… (rendering "+($("dur").value)+"s)");
  rec.start();
  await animate(Number($("dur").value)||14);
  drawFrame(M.total, $("trail").value); // hold the final frame a beat
  await new Promise(r=>setTimeout(r,400));
  rec.stop(); await done;
  const blob=new Blob(chunks,{type:mime});
  const url=URL.createObjectURL(blob);
  const mb=(blob.size/1048576).toFixed(1);
  $("dl").innerHTML=`<a class="dl" id="save" href="${url}" download="perun-replay.webm">⤓ Save perun-replay.webm (${mb} MB)</a>`;
  $("save").click(); // auto-download
  setBusy("done · saved a "+mb+" MB WebM (all offline)");
  running=false;
};

function setBusy(s){ $("status").textContent=s; }

// first paint
drawFrame(0, "draw");
</script>
</body>
</html>
